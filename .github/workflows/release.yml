name: Release

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  test:
    name: Pre-release Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --verbose

      - name: Security audit
        run: |
          cargo install cargo-audit
          cargo audit

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.runner }}
    needs: test
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-latest
          - target: x86_64-apple-darwin
            runner: macos-latest
          - target: aarch64-apple-darwin
            runner: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation tools
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

      - name: Build release binary
        run: |
          cargo build --release --target ${{ matrix.target }} --example demo
          mkdir -p dist
          BINARY_NAME="loxide-demo-${{ matrix.target }}"
          cp "target/${{ matrix.target }}/release/examples/demo" "dist/${BINARY_NAME}" 2>/dev/null \
            || cp "target/${{ matrix.target }}/release/examples/demo.exe" "dist/${BINARY_NAME}.exe" 2>/dev/null

      - name: Generate checksum
        run: |
          cd dist
          sha256sum * > "loxide-${{ matrix.target }}.sha256" 2>/dev/null \
            || shasum -a 256 * > "loxide-${{ matrix.target }}.sha256"

      - name: Verify version matches tag
        run: |
          TAG_VERSION="${{ github.ref_name }}"
          TAG_VERSION="${TAG_VERSION#v}"
          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "Tag version (${TAG_VERSION}) does not match Cargo.toml version (${CARGO_VERSION})"
            exit 1
          fi
          echo "Version verified: ${TAG_VERSION}"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: loxide-${{ matrix.target }}
          path: dist/
          retention-days: 7

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Generate changelog
        id: changelog
        run: |
          PREVIOUS_TAG=$(git tag --sort=-v:refname | sed -n '2p')
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "body=Initial release" >> $GITHUB_OUTPUT
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%h)" "${PREVIOUS_TAG}..HEAD" | head -50)
            {
              echo "body<<EOF"
              echo "## Changes since ${PREVIOUS_TAG}"
              echo ""
              echo "${CHANGELOG}"
              echo "EOF"
            } >> $GITHUB_OUTPUT
          fi

      - name: Setup Artifactory credentials
        run: |
          mkdir -p ~/.cargo
          cat >> ~/.cargo/credentials.toml <<CREDS
          [registries.rust-appeng-prod]
          token = "Basic ${{ secrets.ARTIFACTORY_CARGO_TOKEN }}"
          CREDS

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Publish to Artifactory
        run: cargo publish --registry rust-appeng-prod
        # TODO: Confirm registry name with team. Update --registry and the
        #       ARTIFACTORY_CARGO_TOKEN secret if the registry changes.
        #       The runner also needs registry index URL in ~/.cargo/config.toml.
        #       Alternatively, run: /desco/group/sysdevops/bin/artifactory cargo login

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: loxide ${{ github.ref_name }}
          body: ${{ steps.changelog.outputs.body }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: artifacts/*
